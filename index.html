<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Text to Speech Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* slate-900 */
            color: #f8fafc; /* slate-50 */
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b; 
        }
        ::-webkit-scrollbar-thumb {
            background: #475569; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b; 
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-10 px-4 sm:px-6 lg:px-8">

    <div class="max-w-4xl w-full bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl overflow-hidden flex flex-col">
        <!-- Header -->
        <div class="bg-gradient-to-r from-indigo-600 to-purple-600 p-6 sm:p-8 flex items-center gap-4">
            <div class="w-14 h-14 bg-white/20 backdrop-blur-md rounded-xl flex items-center justify-center text-2xl text-white shadow-inner">
                <i class="fas fa-wave-square"></i>
            </div>
            <div>
                <h1 class="text-2xl sm:text-3xl font-bold text-white tracking-tight">AI Voice Studio</h1>
                <p class="text-indigo-100 text-sm sm:text-base mt-1">Ubah teks menjadi suara bernyawa dengan kecerdasan buatan.</p>
            </div>
        </div>

        <div class="p-6 sm:p-8 flex flex-col gap-8 bg-slate-900">
            
            <!-- Controls Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                
                <!-- Bahasa -->
                <div class="flex flex-col gap-2">
                    <label class="text-sm font-medium text-slate-300">Bahasa</label>
                    <div class="relative">
                        <select id="language" class="w-full bg-slate-800 border border-slate-700 text-white text-sm rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block p-3 appearance-none cursor-pointer hover:border-slate-600 transition-colors">
                            <option value="Indonesian">Indonesia (ID)</option>
                            <option value="English">English (US)</option>
                            <option value="Japanese">Japanese (JP)</option>
                            <option value="Korean">Korean (KR)</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-400">
                            <i class="fas fa-chevron-down text-xs"></i>
                        </div>
                    </div>
                </div>

                <!-- Karakter Suara -->
                <div class="flex flex-col gap-2">
                    <label class="text-sm font-medium text-slate-300">Karakter Suara</label>
                    <div class="relative">
                        <select id="gender" class="w-full bg-slate-800 border border-slate-700 text-white text-sm rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block p-3 appearance-none cursor-pointer hover:border-slate-600 transition-colors">
                            <option value="male">Pria (Berat & Tegas)</option>
                            <option value="female">Wanita (Lembut & Jelas)</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-400">
                            <i class="fas fa-chevron-down text-xs"></i>
                        </div>
                    </div>
                </div>

                <!-- Emosi / Vibe -->
                <div class="flex flex-col gap-2">
                    <label class="text-sm font-medium text-slate-300">Emosi & Vibe</label>
                    <div class="relative">
                        <select id="emotion" class="w-full bg-slate-800 border border-slate-700 text-white text-sm rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block p-3 appearance-none cursor-pointer hover:border-slate-600 transition-colors">
                            <option value="auto">🤖 Otomatis (Sesuai Teks)</option>
                            <option value="ceria">✨ Ceria & Semangat</option>
                            <option value="sedih">🌧️ Sedih & Melankolis</option>
                            <option value="puitis">📜 Puitis & Tenang</option>
                            <option value="tegas">⚡ Tegas & Profesional</option>
                            <option value="ramah">☕ Ramah & Santai</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-400">
                            <i class="fas fa-chevron-down text-xs"></i>
                        </div>
                    </div>
                </div>

                <!-- Referensi Suara (Opsional / Voice Cloning Simulation) -->
                <div class="flex flex-col gap-2">
                    <label class="text-sm font-medium text-slate-300">Referensi Suara (Opsional)</label>
                    <label for="voice-ref" class="w-full bg-slate-800 border border-slate-700 hover:border-slate-600 text-slate-300 text-sm rounded-lg p-3 flex items-center justify-between cursor-pointer transition-colors">
                        <span id="file-name" class="truncate">Unggah Audio/Video...</span>
                        <i class="fas fa-upload text-indigo-400 ml-2 shrink-0"></i>
                    </label>
                    <input type="file" id="voice-ref" accept="audio/*,video/*" class="hidden">
                </div>

                <!-- Kecepatan Suara & Target Durasi -->
                <div class="flex flex-col gap-2">
                    <label class="text-sm font-medium text-slate-300">Mode Kontrol Kecepatan</label>
                    <div class="flex bg-slate-800 p-1 rounded-lg border border-slate-700">
                        <button type="button" id="mode-speed-btn" class="flex-1 py-1.5 px-3 rounded-md text-xs font-semibold bg-indigo-600 text-white transition-all shadow-sm">Granular Kecepatan</button>
                        <button type="button" id="mode-duration-btn" class="flex-1 py-1.5 px-3 rounded-md text-xs font-medium text-slate-400 hover:text-white transition-all">Target Durasi (Detik)</button>
                    </div>
                </div>

                <!-- Kontrol Granular Kecepatan -->
                <div id="speed-control-container" class="flex flex-col gap-2">
                    <div class="flex justify-between items-center">
                        <label class="text-sm font-medium text-slate-300">Kecepatan Suara</label>
                        <span id="speed-value-display" class="text-xs font-mono text-indigo-400 bg-indigo-950/50 px-2 py-0.5 rounded border border-indigo-800/50">1.00x (Normal)</span>
                    </div>
                    <div class="flex items-center gap-3 pt-2">
                        <span class="text-xs text-slate-500 font-mono">0.5x</span>
                        <input type="range" id="speed-slider" min="0.5" max="2.0" step="0.05" value="1.0" class="w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-indigo-500">
                        <span class="text-xs text-slate-500 font-mono">2.0x</span>
                    </div>
                </div>

                <!-- Kontrol Target Durasi (Hidden by default) -->
                <div id="duration-control-container" class="hidden flex flex-col gap-2">
                    <div class="flex justify-between items-center">
                        <label class="text-sm font-medium text-slate-300">Target Durasi Audio</label>
                        <span id="duration-value-display" class="text-xs font-mono text-purple-400 bg-purple-950/50 px-2 py-0.5 rounded border border-purple-800/50">Estimasi Otomatis</span>
                    </div>
                    <div class="flex items-center gap-3 pt-1">
                        <div class="relative w-full">
                            <input type="number" id="target-duration-input" min="3" max="300" placeholder="Contoh: 15 (detik)" class="w-full bg-slate-800 border border-slate-700 text-white text-sm rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block p-2.5 placeholder-slate-500">
                            <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-slate-400 text-xs">
                                detik
                            </div>
                        </div>
                    </div>
                    <p class="text-[11px] text-slate-400">Kecepatan akan disesuaikan secara otomatis agar narasi pas dengan durasi ini.</p>
                </div>

            </div>

            <!-- Teks Narasi -->
            <div class="flex flex-col gap-2">
                <div class="flex justify-between items-center">
                    <label class="text-sm font-medium text-slate-300">Teks Narasi</label>
                    <span class="text-xs text-slate-500">Tanpa batas karakter</span>
                </div>
                <textarea id="narrative-text" rows="6" class="w-full bg-slate-800 border border-slate-700 text-white text-sm rounded-xl focus:ring-indigo-500 focus:border-indigo-500 block p-4 placeholder-slate-500 resize-y transition-colors" placeholder="Ketik atau tempel naskah narasi Anda di sini...&#10;Contoh: Di sebuah lembah yang sunyi, angin berhembus membawa pesan dari masa lalu."></textarea>
            </div>

            <!-- Generate Button -->
            <button id="generate-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-4 px-6 rounded-xl shadow-lg shadow-indigo-600/30 transition-all active:scale-[0.98] flex items-center justify-center gap-3 group disabled:opacity-70 disabled:cursor-not-allowed disabled:active:scale-100">
                <i class="fas fa-magic text-indigo-200 group-hover:rotate-12 transition-transform"></i>
                <span id="generate-text">Generate Audio</span>
                <div id="loading-indicator" class="hidden flex gap-1 items-center">
                    <div class="w-2 h-2 bg-white rounded-full animate-bounce [animation-delay:-0.3s]"></div>
                    <div class="w-2 h-2 bg-white rounded-full animate-bounce [animation-delay:-0.15s]"></div>
                    <div class="w-2 h-2 bg-white rounded-full animate-bounce"></div>
                </div>
            </button>

            <!-- Output Section -->
            <div id="audio-output" class="hidden mt-4 p-6 bg-slate-800/50 border border-slate-700 rounded-xl flex flex-col gap-4">
                <h3 class="text-sm font-semibold text-slate-300 uppercase tracking-wider">Hasil Generate</h3>
                
                <div class="flex flex-col sm:flex-row items-center gap-4">
                    <audio id="audio-player" class="w-full max-w-full rounded-lg" controls>
                        Your browser does not support the audio element.
                    </audio>
                    
                    <button id="download-btn" class="w-full sm:w-auto shrink-0 bg-slate-700 hover:bg-slate-600 text-white font-medium py-3 px-5 rounded-lg flex items-center justify-center gap-2 transition-colors border border-slate-600">
                        <i class="fas fa-download"></i> Unduh (.wav)
                    </button>
                </div>
            </div>

        </div>
    </div>

    <script>
        const fileInput = document.getElementById('voice-ref');
        const fileNameDisplay = document.getElementById('file-name');
        const generateBtn = document.getElementById('generate-btn');
        const generateText = document.getElementById('generate-text');
        const loadingIndicator = document.getElementById('loading-indicator');
        const audioPlayerContainer = document.getElementById('audio-output');
        const audioElement = document.getElementById('audio-player');
        const downloadBtn = document.getElementById('download-btn');

        // Speed & Duration Mode Handlers
        const modeSpeedBtn = document.getElementById('mode-speed-btn');
        const modeDurationBtn = document.getElementById('mode-duration-btn');
        const speedContainer = document.getElementById('speed-control-container');
        const durationContainer = document.getElementById('duration-control-container');
        const speedSlider = document.getElementById('speed-slider');
        const speedValueDisplay = document.getElementById('speed-value-display');
        const targetDurationInput = document.getElementById('target-duration-input');
        
        let controlMode = 'speed'; // 'speed' or 'duration'

        modeSpeedBtn.addEventListener('click', () => {
            controlMode = 'speed';
            modeSpeedBtn.className = 'flex-1 py-1.5 px-3 rounded-md text-xs font-semibold bg-indigo-600 text-white transition-all shadow-sm';
            modeDurationBtn.className = 'flex-1 py-1.5 px-3 rounded-md text-xs font-medium text-slate-400 hover:text-white transition-all';
            speedContainer.classList.remove('hidden');
            durationContainer.classList.add('hidden');
        });

        modeDurationBtn.addEventListener('click', () => {
            controlMode = 'duration';
            modeDurationBtn.className = 'flex-1 py-1.5 px-3 rounded-md text-xs font-semibold bg-purple-600 text-white transition-all shadow-sm';
            modeSpeedBtn.className = 'flex-1 py-1.5 px-3 rounded-md text-xs font-medium text-slate-400 hover:text-white transition-all';
            durationContainer.classList.remove('hidden');
            speedContainer.classList.add('hidden');
        });

        speedSlider.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            let label = `${val.toFixed(2)}x`;
            if (val === 1.0) label += ' (Normal)';
            else if (val < 1.0) label += ' (Lambat)';
            else label += ' (Cepat)';
            speedValueDisplay.textContent = label;
        });

        // File Input UI Handler
        if (fileInput) {
            fileInput.addEventListener('change', (e) => {
                if (e.target.files.length > 0) {
                    const file = e.target.files[0];
                    let name = file.name;
                    if(name.length > 20) name = name.substring(0, 17) + '...';
                    fileNameDisplay.innerHTML = `<span class="text-indigo-400">${name}</span>`;
                    showToast('Catatan: Voice Cloning 1:1 dari file sedang disimulasikan. AI akan mencari karakter terdekat.', 'info');
                } else {
                    fileNameDisplay.innerHTML = 'Unggah Audio/Video...';
                }
            });
        }

        // Toast Notification System
        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `fixed bottom-4 right-4 p-4 rounded-lg text-white text-sm shadow-lg transform transition-all translate-y-full opacity-0 z-50 flex items-center gap-3 max-w-sm`;
            
            if (type === 'success') {
                toast.classList.add('bg-green-600');
                toast.innerHTML = `<i class="fas fa-check-circle text-lg"></i> <span>${message}</span>`;
            } else if (type === 'error') {
                toast.classList.add('bg-red-600');
                toast.innerHTML = `<i class="fas fa-exclamation-circle text-lg"></i> <span>${message}</span>`;
            } else {
                toast.classList.add('bg-indigo-600');
                toast.innerHTML = `<i class="fas fa-info-circle text-lg"></i> <span>${message}</span>`;
            }

            document.body.appendChild(toast);

            setTimeout(() => {
                toast.classList.remove('translate-y-full', 'opacity-0');
            }, 100);

            setTimeout(() => {
                toast.classList.add('translate-y-full', 'opacity-0');
                setTimeout(() => {
                    document.body.removeChild(toast);
                }, 300);
            }, 4000);
        }

        function base64ToArrayBuffer(base64) {
            const binaryString = window.atob(base64);
            const len = binaryString.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            return bytes.buffer;
        }

        function pcmToWav(pcmData, sampleRate) {
            const numChannels = 1;
            const bitsPerSample = 16;
            const byteRate = sampleRate * numChannels * (bitsPerSample / 8);
            const blockAlign = numChannels * (bitsPerSample / 8);
            const dataSize = pcmData.length * (bitsPerSample / 8);
            const buffer = new ArrayBuffer(44 + dataSize);
            const view = new DataView(buffer);

            const writeString = (v, offset, str) => { for (let i = 0; i < str.length; i++) v.setUint8(offset + i, str.charCodeAt(i)); };
            writeString(view, 0, 'RIFF');
            view.setUint32(4, 36 + dataSize, true);
            writeString(view, 8, 'WAVE');
            writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, numChannels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, byteRate, true);
            view.setUint16(32, blockAlign, true);
            view.setUint16(34, bitsPerSample, true);
            writeString(view, 36, 'data');
            view.setUint32(40, dataSize, true);

            let offset = 44;
            for (let i = 0; i < pcmData.length; i++) {
                view.setInt16(offset, pcmData[i], true);
                offset += 2;
            }

            return new Blob([buffer], { type: 'audio/wav' });
        }

        generateBtn.addEventListener('click', async () => {
            const text = document.getElementById('narrative-text').value.trim();
            const language = document.getElementById('language').value;
            const emotion = document.getElementById('emotion').value;
            const voiceName = document.getElementById('gender').value; 

            if (!text) {
                showToast('Harap masukkan teks narasi terlebih dahulu.', 'error');
                return;
            }

            // Calculate precise speed instruction
            let effectiveSpeed = 1.0;
            if (controlMode === 'speed') {
                effectiveSpeed = parseFloat(speedSlider.value);
            } else {
                const targetSec = parseFloat(targetDurationInput.value);
                if (targetSec && targetSec > 0) {
                    // Estimate normal reading speed: ~15 characters per second
                    const estimatedNormalSec = text.length / 15;
                    effectiveSpeed = estimatedNormalSec / targetSec;
                    // Clamp between 0.5x and 2.0x limits of model
                    if (effectiveSpeed < 0.5) effectiveSpeed = 0.5;
                    if (effectiveSpeed > 2.0) effectiveSpeed = 2.0;
                }
            }

            let speedInstruction = "";
            if (effectiveSpeed < 0.9) {
                speedInstruction = `Please speak slowly and deliberately at a granular speed rate of approximately ${effectiveSpeed.toFixed(2)}x normal pace. `;
            } else if (effectiveSpeed > 1.1) {
                speedInstruction = `Please speak briskly and at a faster pace of approximately ${effectiveSpeed.toFixed(2)}x normal speed. `;
            } else {
                speedInstruction = `Please speak at a balanced, natural tempo (${effectiveSpeed.toFixed(2)}x). `;
            }

            generateBtn.disabled = true;
            generateText.classList.add('hidden');
            loadingIndicator.classList.remove('hidden');
            audioPlayerContainer.classList.add('hidden');

            try {
                let prompt = "";
                if (emotion === 'auto') {
                    prompt = `${speedInstruction}Say the following text. The text is in ${language} language. Please analyze the text and automatically adjust your tone and emotion to match the sentiment and context of the narrative.\n\nText: "${text}"`;
                } else {
                    prompt = `${speedInstruction}Say the following text in a ${emotion} tone/vibe. The text is in ${language} language. Make sure to express the requested emotion clearly.\n\nText: "${text}"`;
                }

                let voiceID = 'Charon'; 
                if (voiceName === 'female') voiceID = 'Kore'; 

                const payload = {
                    contents: [{
                        parts: [{ text: prompt }]
                    }],
                    generationConfig: {
                        responseModalities: ["AUDIO"],
                        speechConfig: {
                            voiceConfig: {
                                prebuiltVoiceConfig: { voiceName: voiceID }
                            }
                        }
                    },
                    model: "gemini-2.5-flash-preview-tts"
                };

                const apiKey = window.prompt('Enter your Gemini API key:');
                if (!apiKey) {
                    throw new Error('Gemini API key is required.');
                }
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`;

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error(`Gagal menghubungi API. Status: ${response.status}`);
                }

                const result = await response.json();
                
                const part = result?.candidates?.[0]?.content?.parts?.[0];
                const audioData = part?.inlineData?.data;
                const mimeType = part?.inlineData?.mimeType;

                if (audioData && mimeType && mimeType.startsWith("audio/")) {
                    const rateMatch = mimeType.match(/rate=(\d+)/);
                    const sampleRate = rateMatch ? parseInt(rateMatch[1], 10) : 24000;
                    
                    const pcmBuffer = base64ToArrayBuffer(audioData);
                    const pcm16 = new Int16Array(pcmBuffer);
                    const wavBlob = pcmToWav(pcm16, sampleRate);
                    const audioUrl = URL.createObjectURL(wavBlob);

                    loadingIndicator.classList.add('hidden');
                    generateText.classList.remove('hidden');
                    generateBtn.disabled = false;
                    audioPlayerContainer.classList.remove('hidden');

                    audioElement.src = audioUrl;

                    downloadBtn.onclick = () => {
                        const a = document.createElement('a');
                        a.href = audioUrl;
                        a.download = `Voice_Studio_${Date.now()}.wav`;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        showToast('File WAV berhasil diunduh.', 'success');
                    };

                    showToast('Audio berhasil dibuat dengan kecepatan presisi!', 'success');
                } else {
                    throw new Error("Format respons dari API tidak valid atau data audio tidak ditemukan.");
                }

            } catch (error) {
                console.error("TTS Generation Error:", error);
                loadingIndicator.classList.add('hidden');
                generateText.classList.remove('hidden');
                generateBtn.disabled = false;
                showToast(error.message || 'Terjadi kesalahan saat memproses permintaan.', 'error');
            }
        });
    </script>
</body>
</html>
